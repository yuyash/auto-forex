name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.releases_created == 'true'

    steps:
      - name: Wait for Build workflow to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for Build workflow to complete on ${{ github.sha }}..."
          for i in $(seq 1 60); do
            STATUS=$(gh run list \
              --repo ${{ github.repository }} \
              --workflow build.yml \
              --commit ${{ github.sha }} \
              --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"')

            if [[ "$STATUS" == "completed success" ]]; then
              echo "✅ Build succeeded"
              exit 0
            elif [[ "$STATUS" == *"failure"* || "$STATUS" == *"cancelled"* ]]; then
              echo "❌ Build failed or cancelled: $STATUS"
              exit 1
            fi

            echo "Attempt $i/60 - Build status: $STATUS"
            sleep 30
          done
          echo "❌ Timed out waiting for Build workflow"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${SSH_PORT} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>&1 || echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy to production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ssh -p ${SSH_PORT} ${SERVER_USER}@${SERVER_HOST} "mkdir -p ${DEPLOY_PATH}/certbot/conf ${DEPLOY_PATH}/certbot/www ${DEPLOY_PATH}/certbot/work ${DEPLOY_PATH}/certbot/logs ${DEPLOY_PATH}/logs"

          scp -P ${SSH_PORT} docker-compose.prod.yaml ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/docker-compose.yaml

          scp -P ${SSH_PORT} -r nginx ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/

          ssh -p ${SSH_PORT} ${SERVER_USER}@${SERVER_HOST} \
            "DEPLOY_PATH='${DEPLOY_PATH}' DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' bash -se" << 'EOF'
            set -euo pipefail
            cd ${DEPLOY_PATH}

          if [ ! -f .env ]; then
            echo ".env is missing in ${DEPLOY_PATH}. Create it before deploying."
            exit 1
          fi

          if ! grep -q "DOCKERHUB_USERNAME" .env; then
            echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" >> .env
          fi

          docker compose config > /dev/null
          DRAINED_TRADING_TASK_IDS=""
          DRAINED_BACKTEST_TASK_IDS=""
          RESTART_BACKTEST_TASK_IDS=""
          if docker compose ps --services --status running | grep -qx backend; then
            TRADING_DRAIN_OUTPUT=$(docker compose exec --interactive=false -T backend \
              python manage.py drain_trading_for_deploy --mode graceful --emit-task-ids </dev/null)
            printf '%s\n' "$TRADING_DRAIN_OUTPUT"
            DRAINED_TRADING_TASK_IDS=$(printf '%s\n' "$TRADING_DRAIN_OUTPUT" | sed -n 's/^DRAINED_TASK_IDS=//p' | tail -n 1)

            BACKTEST_DRAIN_OUTPUT=$(docker compose exec --interactive=false -T backend \
              python manage.py shell -c 'exec(__import__("textwrap").dedent("""
                import sys
                import time

                from apps.trading.enums import TaskStatus
                from apps.trading.models import BacktestTask
                from apps.trading.models.celery import CeleryTaskStatus
                from apps.trading.tasks.service import TaskService

                ACTIVE_STATUSES = (TaskStatus.STARTING, TaskStatus.RUNNING, TaskStatus.STOPPING)
                REQUESTABLE_STATUSES = (TaskStatus.STARTING, TaskStatus.RUNNING)
                TIMEOUT_SECONDS = 180
                POLL_INTERVAL_SECONDS = 2.0


                def is_pause_settled(task):
                    execution_id = getattr(task, "execution_id", None)
                    if not execution_id:
                        return True
                    instance_key = f"{task.pk}:{execution_id}"
                    celery_status = (
                        CeleryTaskStatus.objects.filter(
                            task_name="trading.tasks.run_backtest_task",
                            instance_key=instance_key,
                        )
                        .values_list("status", flat=True)
                        .first()
                    )
                    return celery_status in {
                        None,
                        CeleryTaskStatus.Status.PAUSED,
                        CeleryTaskStatus.Status.STOPPED,
                        CeleryTaskStatus.Status.COMPLETED,
                        CeleryTaskStatus.Status.FAILED,
                    }


                def remaining_tasks(pause_ids):
                    active = list(
                        BacktestTask.objects.select_related("config", "user")
                        .filter(status__in=ACTIVE_STATUSES)
                        .order_by("created_at")
                    )
                    remaining_by_id = {task.pk: task for task in active}
                    if pause_ids:
                        paused_tasks = list(
                            BacktestTask.objects.select_related("config", "user")
                            .filter(pk__in=pause_ids)
                            .order_by("created_at")
                        )
                        for task in paused_tasks:
                            if task.status == TaskStatus.PAUSED and is_pause_settled(task):
                                remaining_by_id.pop(task.pk, None)
                            else:
                                remaining_by_id[task.pk] = task
                    return list(remaining_by_id.values())


                service = TaskService()
                active_tasks = list(
                    BacktestTask.objects.select_related("config", "user")
                    .filter(status__in=ACTIVE_STATUSES)
                    .order_by("created_at")
                )

                if not active_tasks:
                    print("No active backtest tasks to drain.")
                    print("DRAINED_BACKTEST_TASK_IDS=")
                    print("RESTART_BACKTEST_TASK_IDS=")
                    raise SystemExit(0)

                pause_ids = []
                restart_ids = []
                print(
                    f"Draining {len(active_tasks)} active backtest task(s) "
                    "with mixed pause/restart mode."
                )
                for task in active_tasks:
                    is_in_memory = getattr(task, "in_memory_mode", False) is True
                    if task.status not in REQUESTABLE_STATUSES:
                        print(
                            f"- Skipping request for {task.pk} ({task.name}, "
                            f"status={task.status}, in_memory={is_in_memory}); "
                            "waiting for it to settle."
                        )
                        continue
                    if is_in_memory:
                        restart_ids.append(task.pk)
                        print(
                            f"- Requesting graceful stop for in-memory backtest {task.pk} "
                            f"({task.name}, strategy={task.config.strategy_type}, "
                            f"instrument={task.instrument}, status={task.status}, "
                            f"execution_id={task.execution_id})"
                        )
                        service.stop_task(task.pk, mode="graceful")
                    else:
                        pause_ids.append(task.pk)
                        print(
                            f"- Requesting pause for {task.pk} "
                            f"({task.name}, strategy={task.config.strategy_type}, "
                            f"instrument={task.instrument}, status={task.status}, "
                            f"execution_id={task.execution_id})"
                        )
                        service.pause_task(task.pk)

                deadline = time.monotonic() + TIMEOUT_SECONDS
                while time.monotonic() < deadline:
                    remaining = remaining_tasks(pause_ids)
                    if not remaining:
                        print("All active backtest tasks drained.")
                        print(
                            "DRAINED_BACKTEST_TASK_IDS="
                            + ",".join(str(task_id) for task_id in pause_ids)
                        )
                        print(
                            "RESTART_BACKTEST_TASK_IDS="
                            + ",".join(str(task_id) for task_id in restart_ids)
                        )
                        raise SystemExit(0)
                    summary = ", ".join(
                        f"{task.pk}:{task.status}:{task.config.strategy_type}:{task.instrument}"
                        for task in remaining
                    )
                    print(f"Waiting for {len(remaining)} backtest task(s): {summary}")
                    time.sleep(POLL_INTERVAL_SECONDS)

                summary = ", ".join(
                    f"{task.pk}:{task.status}:{task.config.strategy_type}:{task.instrument}"
                    for task in remaining_tasks(pause_ids)
                )
                sys.exit(
                    "Timed out draining active backtest tasks before deployment. "
                    "Remaining task(s): " + summary
                )
              """))'
            )
            printf '%s\n' "$BACKTEST_DRAIN_OUTPUT"
            DRAINED_BACKTEST_TASK_IDS=$(printf '%s\n' "$BACKTEST_DRAIN_OUTPUT" | sed -n 's/^DRAINED_BACKTEST_TASK_IDS=//p' | tail -n 1)
            RESTART_BACKTEST_TASK_IDS=$(printf '%s\n' "$BACKTEST_DRAIN_OUTPUT" | sed -n 's/^RESTART_BACKTEST_TASK_IDS=//p' | tail -n 1)
          else
            echo "Backend is not currently running; skipping task drain."
          fi
          docker compose pull
          docker compose down
          docker compose up -d

          echo "Waiting for PostgreSQL to be healthy..."
          sleep 15

          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            BACKEND_STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' backend 2>/dev/null || echo missing)
            if [ "$BACKEND_STATUS" = "healthy" ]; then
              break
            fi
            echo "Attempt $i/30 - backend health: $BACKEND_STATUS"
            sleep 5
          done
          if [ "${BACKEND_STATUS:-missing}" != "healthy" ]; then
            echo "Backend did not become healthy after deployment."
            exit 1
          fi

          if [ -n "$DRAINED_TRADING_TASK_IDS" ]; then
            echo "Resuming drained trading tasks: $DRAINED_TRADING_TASK_IDS"
            OLD_IFS=$IFS
            IFS=','
            for task_id in $DRAINED_TRADING_TASK_IDS; do
              [ -z "$task_id" ] && continue
              docker compose exec --interactive=false -T backend \
                python manage.py resume_trading "$task_id" </dev/null
            done
            IFS=$OLD_IFS
          else
            echo "No trading tasks needed resume after deployment."
          fi

          if [ -n "$DRAINED_BACKTEST_TASK_IDS" ]; then
            echo "Resuming drained backtest tasks: $DRAINED_BACKTEST_TASK_IDS"
            OLD_IFS=$IFS
            IFS=','
            for task_id in $DRAINED_BACKTEST_TASK_IDS; do
              [ -z "$task_id" ] && continue
              docker compose exec --interactive=false -T backend \
                python manage.py resume_backtest "$task_id" </dev/null
            done
            IFS=$OLD_IFS
          else
            echo "No backtest tasks needed resume after deployment."
          fi

          if [ -n "$RESTART_BACKTEST_TASK_IDS" ]; then
            echo "Restarting drained in-memory backtest tasks: $RESTART_BACKTEST_TASK_IDS"
            OLD_IFS=$IFS
            IFS=','
            for task_id in $RESTART_BACKTEST_TASK_IDS; do
              [ -z "$task_id" ] && continue
              docker compose exec --interactive=false -T backend \
                python manage.py restart_backtest "$task_id" </dev/null
            done
            IFS=$OLD_IFS
          else
            echo "No in-memory backtest tasks needed restart after deployment."
          fi

          docker image prune -af
          docker compose ps
          EOF

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p ${SSH_PORT} ${SERVER_USER}@${SERVER_HOST} 'bash -se' << EOF
            set -euo pipefail
            cd ${DEPLOY_PATH}

            sleep 10

            RUNNING_COUNT=\$(docker compose ps --status running --format json | wc -l)
            TOTAL_COUNT=\$(docker compose ps --format json | wc -l)

            echo "Running services: \${RUNNING_COUNT}/\${TOTAL_COUNT}"

            if [ "\${RUNNING_COUNT}" -eq "\${TOTAL_COUNT}" ] && [ "\${RUNNING_COUNT}" -gt 0 ]; then
              echo "✅ Deployment successful - all services are running"
              docker compose ps
              exit 0
            else
              echo "❌ Deployment failed - not all services are running"
              docker compose ps
              echo ""
              echo "Recent logs:"
              docker compose logs --tail=50
              exit 1
            fi
          EOF
