[project]
name = "auto-forex-server"
version = "0.1.2"
description = "Server package for AutoForexV2."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yuya Shinde" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "auto-forex-core>=0.1,<0.2",
    "auto-forex-protobuf>=0.1,<0.2",
    "auto-forex-snowball>=0.1,<0.2",
    "grpcio>=1.81.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
aws = ["auto-forex-aws>=0.1,<0.2"]
oanda = ["auto-forex-oanda>=0.1,<0.2"]
postgresql = ["psycopg[binary]>=3.2.0"]
all = ["auto-forex-server[aws,oanda,postgresql]"]

[project.scripts]
auto-forex-server = "autoforex.server.main:main"
auto-forex-server-config = "autoforex.server.configuration:main"
auto-forex-server-service = "autoforex.server.service:main"

[project.urls]
Repository = "https://github.com/yuyash/auto-forex-v2"
Issues = "https://github.com/yuyash/auto-forex-v2/issues"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autoforex.server"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.coverage.run]
source = ["src"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"

[tool.uv.sources]
auto-forex-core = { workspace = true }
auto-forex-protobuf = { workspace = true }
auto-forex-snowball = { workspace = true }
auto-forex-aws = { workspace = true }
auto-forex-oanda = { workspace = true }
