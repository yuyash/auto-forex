[project]
name = "auto-forex-api"
version = "0.1.0"
description = "FastAPI service for AutoForexV2."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "auto-forex-protobuf",
    "fastapi>=0.138.1",
    "grpcio>=1.81.1",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
auto-forex-api = "api.main:main"
export-openapi = "api.export_openapi:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ty.environment]
python-version = "3.14"

[tool.uv.sources]
auto-forex-protobuf = { workspace = true }
