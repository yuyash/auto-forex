default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --all-packages --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: ruff format
        entry: uv run --all-packages --no-sync ruff format --check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]

      - id: ty-check-core
        name: ty check (core)
        entry: uv run --all-packages --directory src/core --no-sync ty check
        language: system
        types_or: [python, pyi]
        files: ^src/core/
        pass_filenames: false

      - id: pytest-core
        name: pytest (core)
        entry: uv run --all-packages --directory src/core --no-sync pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-aws
        name: pytest (aws)
        entry: uv run --all-packages --directory src/aws --no-sync pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-oanda
        name: pytest (oanda)
        entry: uv run --all-packages --directory src/oanda --no-sync pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-server
        name: pytest (server)
        entry: uv run --all-packages --directory src/server --no-sync pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-snowball
        name: pytest (snowball)
        entry: uv run --all-packages --directory src/snowball --no-sync pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check-notebooks
        name: ty check (notebooks)
        entry: uv run --all-packages --directory src/notebooks --no-sync ty check
        language: system
        types_or: [python, pyi, jupyter]
        files: ^src/notebooks/
        pass_filenames: false
